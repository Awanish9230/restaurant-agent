<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gourmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E05A47" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E05A47" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#gourmetGrad)" filter="url(#glow)"/>

  <!-- Chef Hat / Cloche & Sparkle Emblem in White -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cloche dome / Chef Cap -->
    <path d="M20 38 C20 28 44 28 44 38 Z" fill="#FFFFFF" fill-opacity="0.2"/>
    <path d="M16 42 L48 42" stroke-width="4"/>
    <path d="M20 38 Q32 24 44 38"/>
    <!-- Cloche Handle -->
    <circle cx="32" cy="22" r="2.5" fill="#FFFFFF"/>
    <!-- Base Plate -->
    <path d="M14 46 L50 46" stroke-width="3" stroke-opacity="0.8"/>
    
    <!-- AI Sparkle Top Right -->
    <path d="M46 14 L46 20 M43 17 L49 17" stroke-width="2.5" stroke="#FFF7ED"/>
  </g>
</svg>
